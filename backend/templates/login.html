<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MangaFire PRO</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0c; color: #f0f0f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #141418; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(255, 51, 0, 0.2); width: 300px; text-align: center; border: 1px solid #2a2a35; }
        h1 { color: #ff3300; font-family: 'Bebas Neue', cursive; font-weight: normal; letter-spacing: 1px; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #2a2a35; border-radius: 4px; background: #0a0a0c; color: #f0f0f5; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #ff3300; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #e62e00; box-shadow: 0 0 10px rgba(255, 51, 0, 0.5); }
        .error { color: #ff3333; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Admin Login</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="{{ url_for('admin.admin_login') }}" method="post">
            <input type="password" name="admin_token" placeholder="Enter Admin Token" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
