<html>
<head>
    <title>Admin Login - MangaFire PRO</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; margin-bottom: 20px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #ff3300; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #e62e00; }
        .error { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Login</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form action="/admin/login" method="post">
            <input type="password" name="admin_token" placeholder="Admin Token" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
