<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga-FireA | Cyberpunk Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="navigate('home')">Manga<span style="color:var(--accent-glow)">FireA</span></a>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search manga..." onkeypress="if(event.key === 'Enter') performSearch()">
            <button id="search-btn" onclick="performSearch()">Scan</button>
        </div>
    </header>

    <main>
        <div id="loader" class="loader"></div>

        <!-- Home / Search Results View -->
        <div id="home-view" class="view active">
            <h2 id="home-title" style="color: var(--accent-glow); font-family: 'Orbitron', sans-serif;">Trending / Results</h2>
            <div id="manga-grid" class="manga-grid">
                <!-- Manga cards injected here -->
            </div>
        </div>

        <!-- Detail View -->
        <div id="detail-view" class="view">
            <div class="detail-header">
                <img id="detail-cover" class="detail-cover" src="" alt="Cover">
                <div class="detail-info">
                    <h1 id="detail-title">Manga Title</h1>
                    <p class="synopsis" id="detail-synopsis">Synopsis goes here...</p>
                    <button class="reader-btn" id="btn-read-first" style="display:none;">Read First Chapter</button>
                    <button class="reader-btn" id="btn-force-update" style="margin-left: 10px; border-color: #888; color: #888;">Force Scrape</button>
                </div>
            </div>

            <div class="chapter-list">
                <h2>
                    <span>Chapters <span id="chapter-count" style="font-size: 1rem; color: #888;">(0)</span></span>
                </h2>
                <div id="chapters-container">
                    <!-- Chapters injected here -->
                </div>
            </div>
        </div>

        <!-- Reader View -->
        <div id="reader-view" class="view">
            <div class="reader-controls">
                <button class="reader-btn" onclick="backToDetail()">← Back to Info</button>
                <h3 id="reader-title" style="margin: 0; font-family: 'Orbitron', sans-serif;">Chapter Title</h3>
                <div>
                    <label style="color: var(--text-muted); margin-right: 1rem; font-family: 'Orbitron', sans-serif; cursor: pointer;">
                        <input type="checkbox" id="reader-mode-toggle" onchange="toggleReaderMode()"> Paged Mode
                    </label>
                    <span id="reader-progress" style="color: var(--accent-primary); font-family: 'Orbitron', sans-serif; font-weight: bold;"></span>
                </div>
            </div>

            <div id="paged-reader-nav" style="display: none; justify-content: center; gap: 1rem; margin-bottom: 1rem;">
                <button class="reader-btn" onclick="prevPage()">← Prev</button>
                <button class="reader-btn" onclick="nextPage()">Next →</button>
            </div>

            <div id="reader-images" class="reader-images">
                <!-- Images injected here -->
            </div>

            <div id="paged-reader-nav-bottom" style="display: none; justify-content: center; gap: 1rem; margin-top: 1rem;">
                <button class="reader-btn" onclick="prevPage()">← Prev</button>
                <button class="reader-btn" onclick="nextPage()">Next →</button>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
