<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga-FireA | Cyberpunk Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-glow: #ff3300;
            --accent-glow-secondary: #ff9900;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Cyberpunk Grid Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(to right, rgba(255, 51, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 51, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        header {
            background: rgba(17, 17, 17, 0.9);
            border-bottom: 2px solid var(--accent-glow);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.4);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow), 0 0 20px var(--accent-glow-secondary);
        }

        .search-container {
            display: flex;
            align-items: center;
        }

        #search-input {
            background: var(--bg-color);
            border: 1px solid var(--accent-glow);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            width: 300px;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        #search-input:focus {
            box-shadow: 0 0 10px rgba(255, 51, 0, 0.5);
        }

        #search-btn {
            background: var(--accent-glow);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        #search-btn:hover {
            background: var(--accent-glow-secondary);
            box-shadow: 0 0 15px var(--accent-glow-secondary);
        }

        main {
            flex-grow: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Views */
        .view {
            display: none;
        }
        .view.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid var(--panel-bg);
            border-top: 4px solid var(--accent-glow);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Grid */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .manga-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .manga-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.3);
        }

        .manga-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 2px solid var(--border-color);
        }

        .manga-card .info {
            padding: 1rem;
            flex-grow: 1;
        }

        .manga-card h3 {
            margin: 0;
            font-size: 1rem;
            color: #fff;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Detail View */
        .detail-header {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            background: var(--panel-bg);
            padding: 2rem;
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 20px rgba(255, 51, 0, 0.1) inset;
        }

        .detail-cover {
            width: 250px;
            height: 350px;
            object-fit: cover;
            border: 2px solid var(--accent-glow);
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.5);
        }

        .detail-info {
            flex-grow: 1;
        }

        .detail-info h1 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            margin-top: 0;
            text-shadow: 0 0 5px var(--accent-glow);
        }

        .synopsis {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-glow);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-glow-secondary);
        }

        .chapter-list {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
        }

        .chapter-list h2 {
            margin-top: 0;
            color: var(--accent-glow-secondary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            border-bottom: 1px solid #222;
            transition: background 0.2s ease;
        }

        .chapter-item:hover {
            background: rgba(255, 51, 0, 0.1);
            border-left: 2px solid var(--accent-glow);
        }

        .chapter-link {
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            flex-grow: 1;
        }

        .chapter-link:hover {
            color: #fff;
            text-shadow: 0 0 5px var(--accent-glow);
        }

        .btn-download {
            background: transparent;
            border: 1px solid var(--accent-glow-secondary);
            color: var(--accent-glow-secondary);
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-download:hover {
            background: var(--accent-glow-secondary);
            color: #000;
            box-shadow: 0 0 10px var(--accent-glow-secondary);
        }

        /* Reader View */
        .reader-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 1rem;
            margin-bottom: 1rem;
            position: sticky;
            top: 70px;
            z-index: 90;
            border: 1px solid var(--accent-glow);
        }

        .reader-btn {
            background: transparent;
            border: 1px solid var(--accent-glow);
            color: var(--accent-glow);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .reader-btn:hover {
            background: var(--accent-glow);
            color: #000;
        }

        .reader-images {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; /* Webtoon continuous scroll style */
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #000;
        }

        .reader-images img {
            max-width: 100%;
            height: auto;
            display: block;
            min-height: 500px; /* Placeholder height to prevent jumping */
            background: #111;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="navigate('home')">Manga<span style="color:var(--accent-glow)">FireA</span></a>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search manga..." onkeypress="if(event.key === 'Enter') performSearch()">
            <button id="search-btn" onclick="performSearch()">Scan</button>
        </div>
    </header>

    <main>
        <div id="loader" class="loader"></div>

        <!-- Home / Search Results View -->
        <div id="home-view" class="view active">
            <h2 id="home-title" style="color: var(--accent-glow); font-family: 'Orbitron', sans-serif;">Trending / Results</h2>
            <div id="manga-grid" class="manga-grid">
                <!-- Manga cards injected here -->
            </div>
        </div>

        <!-- Detail View -->
        <div id="detail-view" class="view">
            <div class="detail-header">
                <img id="detail-cover" class="detail-cover" src="" alt="Cover">
                <div class="detail-info">
                    <h1 id="detail-title">Manga Title</h1>
                    <p class="synopsis" id="detail-synopsis">Synopsis goes here...</p>
                    <button class="reader-btn" id="btn-read-first" style="display:none;">Read First Chapter</button>
                    <button class="reader-btn" id="btn-force-update" style="margin-left: 10px; border-color: #888; color: #888;">Force Scrape</button>
                </div>
            </div>

            <div class="chapter-list">
                <h2>
                    <span>Chapters <span id="chapter-count" style="font-size: 1rem; color: #888;">(0)</span></span>
                </h2>
                <div id="chapters-container">
                    <!-- Chapters injected here -->
                </div>
            </div>
        </div>

        <!-- Reader View -->
        <div id="reader-view" class="view">
            <div class="reader-controls">
                <button class="reader-btn" onclick="backToDetail()">← Back to Info</button>
                <h3 id="reader-title" style="margin: 0; font-family: 'Orbitron', sans-serif;">Chapter Title</h3>
                <div>
                    <span style="color: var(--text-muted)">Scroll to read</span>
                </div>
            </div>
            <div id="reader-images" class="reader-images">
                <!-- Images injected here -->
            </div>
        </div>
    </main>

    <script>
        let currentMangaId = null;
        let currentMangaData = null;

        const loader = document.getElementById('loader');
        const views = {
            home: document.getElementById('home-view'),
            detail: document.getElementById('detail-view'),
            reader: document.getElementById('reader-view')
        };

        function showLoader() { loader.style.display = 'block'; }
        function hideLoader() { loader.style.display = 'none'; }

        function navigate(viewName) {
            Object.values(views).forEach(v => v.classList.remove('active'));
            views[viewName].classList.add('active');
            window.scrollTo(0, 0);
        }

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            navigate('home');
            showLoader();
            document.getElementById('manga-grid').innerHTML = '';
            document.getElementById('home-title').innerText = `Search Results for "${query}"`;

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                const grid = document.getElementById('manga-grid');
                if (data.length === 0) {
                    grid.innerHTML = '<p>No results found.</p>';
                } else {
                    data.forEach(manga => {
                        const card = document.createElement('div');
                        card.className = 'manga-card';

                        const proxyCover = manga.cover_url ? `/api/proxy-image?url=${encodeURIComponent(manga.cover_url)}` : 'https://via.placeholder.com/200x300?text=No+Cover';

                        card.innerHTML = `
                            <img loading="lazy">
                            <div class="info">
                                <h3></h3>
                            </div>
                        `;
                        card.querySelector('img').src = proxyCover;
                        card.querySelector('img').alt = manga.title;
                        card.querySelector('h3').textContent = manga.title;
                        card.onclick = () => loadMangaDetail(manga.id);
                        grid.appendChild(card);
                    });
                }
            } catch (e) {
                console.error(e);
                alert("Search failed. Check console.");
            } finally {
                hideLoader();
            }
        }

        async function loadMangaDetail(mangaId, force = false) {
            navigate('detail');
            showLoader();
            const chapContainer = document.getElementById('chapters-container');
            chapContainer.innerHTML = '';
            document.getElementById('detail-title').innerText = 'Loading...';
            document.getElementById('detail-synopsis').innerText = '';
            document.getElementById('detail-cover').src = '';
            document.getElementById('btn-read-first').style.display = 'none';

            currentMangaId = mangaId;

            try {
                const url = `/api/manga/${mangaId}${force ? '?force=true' : ''}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Manga not found or error fetching details");
                const data = await res.json();
                currentMangaData = data;

                document.getElementById('detail-title').innerText = data.title;
                document.getElementById('detail-synopsis').innerText = data.synopsis || "No synopsis available.";

                const proxyCover = data.cover_url ? `/api/proxy-image?url=${encodeURIComponent(data.cover_url)}` : 'https://via.placeholder.com/250x350?text=No+Cover';
                document.getElementById('detail-cover').src = proxyCover;

                document.getElementById('chapter-count').innerText = `(${data.chapters.length})`;

                if (data.chapters.length > 0) {
                    // aquareader usually lists latest first. We display as returned.
                    data.chapters.forEach(chap => {
                        const div = document.createElement('div');
                        div.className = 'chapter-item';

                        const chapSlug = chap.id.split('/').pop();

                        const linkSpan = document.createElement('span');
                        linkSpan.className = 'chapter-link';
                        linkSpan.textContent = chap.title;
                        linkSpan.onclick = () => loadChapter(chapSlug, chap.title);

                        const dlLink = document.createElement('a');
                        dlLink.href = `/api/download/${mangaId}/${chapSlug}`;
                        dlLink.className = 'btn-download';
                        dlLink.title = 'Download CBZ';
                        dlLink.textContent = '↓ CBZ';

                        div.appendChild(linkSpan);
                        div.appendChild(dlLink);
                        chapContainer.appendChild(div);
                    });

                    // The "first" chapter is usually at the end of the array if sorted newest-first
                    const firstChap = data.chapters[data.chapters.length - 1];
                    const firstChapSlug = firstChap.id.split('/').pop();

                    const btnRead = document.getElementById('btn-read-first');
                    btnRead.onclick = () => loadChapter(firstChapSlug, firstChap.title);
                    btnRead.style.display = 'inline-block';
                } else {
                    chapContainer.innerHTML = '<p>No chapters found.</p>';
                }

                document.getElementById('btn-force-update').onclick = () => loadMangaDetail(mangaId, true);

            } catch (e) {
                console.error(e);
                document.getElementById('detail-title').innerText = "Error loading details.";
                chapContainer.innerHTML = `<p style="color:red;">Error: Could not load manga details. ${e.message}</p>`;
            } finally {
                hideLoader();
            }
        }

        function backToDetail() {
            if (currentMangaId) {
                navigate('detail');
            } else {
                navigate('home');
            }
        }

        async function loadChapter(chapterSlug, chapterTitle) {
            navigate('reader');
            showLoader();
            const container = document.getElementById('reader-images');
            container.innerHTML = '';
            document.getElementById('reader-title').innerText = `${currentMangaData ? currentMangaData.title : ''} - ${chapterTitle}`;

            try {
                const res = await fetch(`/api/chapter/${currentMangaId}/${chapterSlug}`);
                if (!res.ok) throw new Error("Chapter images not found");
                const data = await res.json();

                if (data.images.length === 0) {
                    container.innerHTML = '<p style="padding: 2rem;">No images found for this chapter.</p>';
                } else {
                    data.images.forEach((imgUrl, idx) => {
                        const img = document.createElement('img');
                        img.src = `/api/proxy-image?url=${encodeURIComponent(imgUrl)}`;
                        img.alt = `Page ${idx + 1}`;
                        img.loading = "lazy";

                        // Add an error handler in case proxy fails
                        img.onerror = function() {
                            console.error(`Failed to load image at index ${idx}`);
                            this.style.display = 'none';
                            const err = document.createElement('div');
                            err.style.color = 'red';
                            err.style.padding = '1rem';
                            err.innerText = `Failed to load image ${idx+1}`;
                            this.parentNode.insertBefore(err, this);
                        };

                        container.appendChild(img);
                    });
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p style="color: red; padding: 2rem;">Error loading chapter images. The source site might be blocking the request.</p>';
            } finally {
                hideLoader();
            }
        }

        // Only search if user typed something, don't auto-search which could hit limits
        window.onload = () => {
            document.getElementById('search-input').value = 'solo leveling';
            performSearch();
        };
    </script>
</body>
</html>
